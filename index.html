<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Google probes /favicon.ico and wants a raster icon of at least 48px; an
         SVG alone gets the generic globe in search results. Add the .ico and the
         PNGs alongside this before launch (Phase 3). -->
    <title>chokkablog</title>
    <!-- No webfont link, deliberately. The design uses the system sans-serif
         stack (see the design concept's notes), which costs no DNS lookup, no
         extra connection and no render-blocking stylesheet. If a webfont is ever
         adopted, self-host it — a fonts.googleapis.com <link> was the single
         biggest blocking request on gers-explorer.com before it was removed. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
