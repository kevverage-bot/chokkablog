<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The SVG is the icon; the .ico exists because Google probes
         /favicon.ico and wants a raster of at least 48px, and an SVG alone got
         the generic globe in search results. All of these are generated from
         public/favicon.svg by scripts/make-icons.sh and committed. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>chokkablog</title>
    <!-- The feed. In the shell rather than added per-page by the prerenderer, so
         it is discoverable from every URL on the site — including one a reader
         reached before the next build wrote that page's own head tags. -->
    <link rel="alternate" type="application/rss+xml" title="chokkablog" href="/rss.xml" />
    <!-- No webfont link, deliberately. The design uses the system sans-serif
         stack (see the design concept's notes), which costs no DNS lookup, no
         extra connection and no render-blocking stylesheet. If a webfont is ever
         adopted, self-host it — a fonts.googleapis.com <link> was the single
         biggest blocking request on gers-explorer.com before it was removed. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
